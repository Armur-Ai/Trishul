# trishul-cli — PyPI distribution.
#
# Published as per-platform binary wheels (ruff/maturin style): each wheel
# carries the native `trishul` Go binary for one platform under
# `trishul_cli/bin/` plus a tiny pure-Python console-script shim. The wheels
# are NOT produced by this build-backend — they are assembled deterministically
# from the goreleaser `dist/` tree by `scripts/pip/build-wheels.py`.
#
# This [project] table is the single source of truth for the package metadata
# (name, version, classifiers, entry point); build-wheels.py reads it via
# tomllib. The setuptools build-backend below only exists so that a plain
# `python -m build --sdist` still works for a source distribution.

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trishul-cli"
version = "0.0.1"
description = "trishul — Security Scanner for Vibe-Coded Software"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Armur AI", email = "hello@trishul.dev"}]
keywords = ["security", "sast", "sca", "secrets", "scanner", "vulnerability", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://trishul.dev"
Repository = "https://github.com/Armur-Ai/trishul"
Issues = "https://github.com/Armur-Ai/trishul/issues"

[project.scripts]
trishul = "trishul_cli._exec:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["trishul_cli*"]
