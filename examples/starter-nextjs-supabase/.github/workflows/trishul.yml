name: Trishul
on: [pull_request]
permissions: { contents: read, pull-requests: write, security-events: write }
jobs:
  trishul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Armur-Ai/Trishul@v0.2.0
        with:
          min-severity: medium
          fail-on: high
