- id: trishul-scan
  name: Trishul Security Scan
  description: >
    Runs Trishul on staged files to catch security vulnerabilities
    before they are committed. Requires the Trishul CLI to be installed and
    a Trishul server running (or use `trishul serve` for auto-start).
  language: system
  entry: trishul scan --staged-only
  types: [file]
  pass_filenames: false
  stages: [commit]
  verbose: false

- id: trishul-scan-strict
  name: Trishul Security Scan (strict — fails on any finding)
  description: >
    Like trishul-scan but exits with code 1 on any finding at medium severity
    or above. Suitable for security-critical repositories.
  language: system
  entry: trishul scan --staged-only --fail-on-findings --min-severity medium
  types: [file]
  pass_filenames: false
  stages: [commit]
  verbose: false
