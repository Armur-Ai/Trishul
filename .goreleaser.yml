version: 2

builds:
  - id: trishul-server
    main: ./cmd/server
    binary: trishul-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

  # Hermetic PR gate used by the GitHub Action (built-in analyzers only).
  - id: trishul-ci
    main: ./cmd/trishul-ci
    binary: trishul-ci
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

  - id: trishul-cli
    dir: cli
    binary: trishul
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: cli-archive
    builds:
      - trishul-cli
    name_template: "trishul_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

  - id: ci-archive
    builds:
      - trishul-ci
    name_template: "trishul-ci_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

  - id: server-archive
    builds:
      - trishul-server
    name_template: "trishul-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

brews:
  - name: trishul
    ids:
      - cli-archive
    # Generate the formula, but only push it to the tap when a token is
    # present. Until Armur-Ai/homebrew-tap + HOMEBREW_TAP_GITHUB_TOKEN exist,
    # this keeps the release green (binaries still publish) instead of failing
    # goreleaser on a 401.
    skip_upload: '{{ eq .Env.HOMEBREW_TAP_GITHUB_TOKEN "" }}'
    repository:
      owner: Armur-Ai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://trishul.dev"
    description: "Security Scanner for Vibe-Coded Software — SAST, SCA, secrets & IaC"
    license: "MIT"
    install: |
      bin.install "trishul"
    test: |
      system "#{bin}/trishul", "version"
