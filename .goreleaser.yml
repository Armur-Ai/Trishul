version: 2

builds:
  - id: trishul-server
    main: ./cmd/server
    binary: trishul-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

  # Hermetic PR gate used by the GitHub Action (built-in analyzers only).
  - id: trishul-ci
    main: ./cmd/trishul-ci
    binary: trishul-ci
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

  - id: trishul-cli
    dir: cli
    binary: trishul
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

  # GitHub App server (webhook receiver + queue + worker).
  - id: trishul-app
    main: ./cmd/trishul-app
    binary: trishul-app
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

archives:
  - id: cli-archive
    ids:
      - trishul-cli
    name_template: "trishul_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [ zip ]

  - id: ci-archive
    ids:
      - trishul-ci
    name_template: "trishul-ci_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [ zip ]

  - id: server-archive
    ids:
      - trishul-server
    name_template: "trishul-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: app-archive
    ids:
      - trishul-app
    name_template: "trishul-app_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

# Software bill of materials per archive (syft, available in CI via goreleaser-action).
sboms:
  - id: archive-sbom
    artifacts: archive

# Keyless cosign signatures over the checksums file. Runs only on a real release
# where cosign + GitHub OIDC are available; skipped on --snapshot.
signs:
  - id: cosign-checksum
    cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

homebrew_casks:
  - name: trishul
    ids:
      - cli-archive
    # Generate the cask, but only push it to the tap when a token is present.
    # Until Armur-Ai/homebrew-tap + HOMEBREW_TAP_GITHUB_TOKEN exist, this keeps
    # the release green (binaries still publish) instead of failing goreleaser
    # on a 401.
    skip_upload: '{{ eq (index .Env "HOMEBREW_TAP_GITHUB_TOKEN") "" }}'
    repository:
      owner: Armur-Ai
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    homepage: "https://trishul.dev"
    description: "Security Scanner for Vibe-Coded Software — SAST, SCA, secrets & IaC"
    license: "MIT"
    # Binary is auto-detected from the archive; modern GoReleaser also strips the
    # Gatekeeper quarantine xattr for casks automatically.
