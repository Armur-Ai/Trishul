# CLIENT-SECRET-* rule registry (internal/tools/clientsecrets.go).
# Read-only detector for secrets that leak into client/browser bundles. Values are
# never emitted — only a redacted preview and a stable fingerprint.
#
# Note: no standalone SECRET-* rule is emitted by first-party analyzer code. The only
# "SECRET-001" occurrence is a Trivy test fixture (VulnerabilityID), and the Rails
# EXPLOIT-RAILS-SECRET-001 belongs to the out-of-scope EXPLOIT family — so neither is
# catalogued here.
rules:
  - id: CLIENT-SECRET-001
    title: Secret assigned to a client-exposed environment variable
    short: A secret-shaped value is bound to a NEXT_PUBLIC_/VITE_/… env var.
    description: |
      A secret-shaped value (length + charset + entropy heuristic) is assigned to a
      client-exposed environment variable (NEXT_PUBLIC_, EXPO_PUBLIC_, REACT_APP_, VITE_,
      PUBLIC_). Variables with these prefixes are inlined into the client/browser bundle at
      build time and are publicly readable.
    default_severity: HIGH
    default_confidence: 0.7
    maturity: stable
    languages: [javascript, typescript, env]
    file_kinds: [config, source]
    cwe: [CWE-200]
    owasp: [A02]
    references: []
    fix: Remove the client-exposed prefix and keep the secret server-side; expose only non-sensitive values via a public prefix.
    examples:
      bad: |
        NEXT_PUBLIC_STRIPE_SECRET_KEY=sk_live_51H8xQ2abcdef0123456789
      good: |
        STRIPE_SECRET_KEY=sk_live_51H8xQ2abcdef0123456789
    mode_default: comment

  - id: CLIENT-SECRET-002
    title: Committed .env file contains a secret
    short: A committed .env assigns a secret-shaped value to a key.
    description: |
      A committed `.env` file (not an example/template) assigns a secret-shaped value to a key.
      Secrets stored in committed env files are exposed to anyone with repository access; the
      finding notes when the file does not appear to be gitignored.
    default_severity: HIGH
    default_confidence: 0.7
    maturity: stable
    languages: [env]
    file_kinds: [config]
    cwe: [CWE-312]
    owasp: [A02]
    references: []
    fix: Remove the secret from the committed .env, add .env to .gitignore, rotate the value, and source it from a secrets manager.
    examples:
      bad: |
        DATABASE_URL=postgres://app:9f3c1ad2e7b84f0c9a12@db.example:5432/app
      good: |
        # .env is gitignored; DATABASE_URL is injected at deploy time
    mode_default: comment

  - id: CLIENT-SECRET-003
    title: Privileged secret in a client-side file
    short: A service_role JWT, sk-key, or private key appears in client code.
    description: |
      A high-confidence privileged secret — a Supabase service_role JWT, an sk-style provider
      key (OpenAI/Anthropic), or a PEM private key — appears in a file that looks client-side
      (a client path or a "use client" directive). These must never ship to the browser.
    default_severity: CRITICAL
    default_confidence: 0.85
    maturity: stable
    languages: [javascript, typescript]
    file_kinds: [source]
    cwe: [CWE-798, CWE-312]
    owasp: [A02]
    references: []
    fix: Keep privileged secrets server-side; call privileged APIs from a server route and rotate any key that reached client code.
    examples:
      bad: |
        "use client"; const sb = createClient(url, "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.sig")
      good: |
        "use client"; const sb = createClient(url, process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY)
    mode_default: block
